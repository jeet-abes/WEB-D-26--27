<!DOCTYPE html>
<html>
<head>
<title>
Hotel Room Booking Form
</title>

<style>
body{border: 3px solid black; padding: 10px;}
</style>

</head>

<body>

<h1 align="center">
Hotel Room Booking Form
</h1>

<form align="center" action="#">

<label for="fullname"> Full Name: </label>
<input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

<br><br>

<label for="email"> Email: </label>
<input type="email" id="email" name="email" placeholder="Enter your email" required>

<br><br>

<label for="phone"> Phone: </label>
<input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
<br><br>

<label for="checkin"> Check-in Date: </label>

<input type="date" id="checkin" name="checkin"> <br><br>

<label for="checkout"> Check-out Date: </label>

<input type="date" id="checkout" name="checkout">

<br><br>

<label for="roomtype"> Room Type: </label>

<select name="room" required>

<option value="">Select a room type</option>
<option value="single"> Single Room </option>
<option value="double"> Double Room </option>
<option value="deluxe"> Deluxe Room </option>
<option value="suite"> Suite </option>

</select>

<br><br>

<label for="specialreq">
     Special Requests: 
</label><br>

<textarea rows="4" cols="30" id="specialreq" name="specialreq" placeholder="Enter any special requests">
</textarea> 

<br><br>

<button>
<input type="submit" value="Submit">
</button>

<button>
<input type="reset" value="Reset">
</button>

</form>
    </body>
</html>
